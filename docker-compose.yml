services:
  postgres:
    image: postgres:16-alpine
    container_name: orvix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-orvix}
      POSTGRES_USER: ${DB_USER:-orvix_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - orvix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orvix_user} -d ${DB_NAME:-orvix}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  orvix_pgdata:
    name: orvix_pgdata
